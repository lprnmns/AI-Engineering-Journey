name: ai-engineering-journey

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      # 6333 is the service-to-service port. 6335 avoids the existing local
      # Qdrant instance used by the earlier demo on this machine.
      - "127.0.0.1:${QDRANT_HOST_PORT:-6335}:6333"
    volumes:
      - ai_journey_week2_qdrant_data:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.50"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    image: ai-journey/document-intelligence-service:local
    build:
      context: ./projects/document_intelligence_service
      dockerfile: Dockerfile
    ports:
      # The container still listens on 8000; 8010 avoids existing local APIs.
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    environment:
      DIS_ENVIRONMENT: compose
      DIS_SERVICE_NAME: document-intelligence-service
      DIS_QDRANT_URL: http://qdrant:6333
      DIS_OLLAMA_URL: ${DIS_OLLAMA_URL:-http://host.docker.internal:11434}
      DIS_DEPENDENCY_TIMEOUT_SECONDS: "2.0"
      DIS_INGESTION_REGISTRY_BACKEND: sqlite
      DIS_INGESTION_DATABASE_PATH: /data/ingestions.sqlite3
      DIS_EMBEDDED_WORKER: "false"
      DIS_BM25_STATE_PATH: /data/bm25_state.json
      # Generic PDFs stay document-level by default. Set this explicitly to
      # mentor_program_v1 only when the uploaded family is the mentor PDF.
      DIS_SECTION_MARKER_PROFILE: ${DIS_SECTION_MARKER_PROFILE:-none}
      DIS_RERANKER_ENABLED: "false"
      DIS_LLM_MODEL: gemma3:4b
      DIS_LLM_TIMEOUT_SECONDS: "120"
      DIS_LLM_MAX_OUTPUT_TOKENS: "128"
      DIS_MAX_UPLOAD_BYTES: "10485760"
      DIS_MAX_PDF_PAGES: "200"
      DIS_ANSWERABILITY_MIN_DENSE_SCORE: "0.379"
      DIS_ANSWERABILITY_MIN_SPARSE_SCORE: "0.1"
      DIS_ANSWERABILITY_MIN_RERANK_SCORE: "-5.0"
      DIS_ANSWERABILITY_MIN_MARGIN: "0.0"
      DIS_ANSWERABILITY_MIN_COVERAGE: "0.0"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_journey_ingestion_data:/data
      - ai_journey_hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.00"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    image: ai-journey/document-intelligence-service:local
    command: ["python", "-m", "app.worker_entrypoint"]
    environment:
      DIS_ENVIRONMENT: compose
      DIS_SERVICE_NAME: document-intelligence-worker
      DIS_QDRANT_URL: http://qdrant:6333
      DIS_OLLAMA_URL: ${DIS_OLLAMA_URL:-http://host.docker.internal:11434}
      DIS_DEPENDENCY_TIMEOUT_SECONDS: "2.0"
      DIS_INGESTION_REGISTRY_BACKEND: sqlite
      DIS_INGESTION_DATABASE_PATH: /data/ingestions.sqlite3
      DIS_BM25_STATE_PATH: /data/bm25_state.json
      DIS_SECTION_MARKER_PROFILE: ${DIS_SECTION_MARKER_PROFILE:-none}
      DIS_RERANKER_ENABLED: "false"
      DIS_LLM_MODEL: gemma3:4b
      DIS_LLM_TIMEOUT_SECONDS: "120"
      DIS_LLM_MAX_OUTPUT_TOKENS: "128"
      DIS_MAX_UPLOAD_BYTES: "10485760"
      DIS_MAX_PDF_PAGES: "200"
      DIS_WORKER_POLL_INTERVAL_SECONDS: "1.0"
      DIS_WORKER_STALE_AFTER_SECONDS: "300.0"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_journey_ingestion_data:/data
      - ai_journey_hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.00"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  demo-ui:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8501:80"
    volumes:
      - ./demo_ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./demo_ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  ai_journey_week2_qdrant_data:
    name: ai_journey_week2_qdrant_data
  ai_journey_ingestion_data:
    name: ai_journey_ingestion_data
  ai_journey_hf_cache:
    name: ai_journey_hf_cache
