[project]
name = "document-intelligence-service"
version = "0.1.0"
description = "Production-minded document intelligence and RAG service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "python-multipart",
    "qdrant-client",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
